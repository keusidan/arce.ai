# Adds the files of a build to the GitHub release of its tag, creating the release when it is missing.
# Used by the release-<platform>.yml workflows.
#
# Why --target is tried twice: GITHUB_TOKEN may not create a tag at a commit that adds or changes a
# file under .github/workflows (that takes the `workflows` permission, which only a person's or an
# app's token can have). The API answers 403 "Resource not accessible by integration" and git refuses
# the push. A commit that is the head of a branch is exempt, so when the branch has moved on since
# the build started (a later push during a 25-minute build), the tag goes on the branch head instead.
name: Publish release
description: Create the release (if missing) and upload the build's files to it.

inputs:
  tag:
    description: Tag of the release, e.g. v0.5.0 or ios-v0.5.0
    required: true
  title:
    description: Title of the release if it has to be created
    required: true
  latest:
    description: '"true" makes it the latest release (only Android: the earlier native app reads /releases/latest)'
    required: false
    default: "false"
  dir:
    description: Folder with the files to upload
    required: false
    default: dist
  sha:
    description: Commit the files were built from
    required: false
    default: ${{ github.sha }}
  token:
    description: Token with contents:write
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        LATEST: ${{ inputs.latest }}
        DIR: ${{ inputs.dir }}
        BUILT_SHA: ${{ inputs.sha }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG exists; adding the files to it"
        else
          create=(gh release create "$TAG" --title "$TITLE" --generate-notes --latest="$LATEST")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # a person pushed the tag already, so there is nothing to point it at
            "${create[@]}"
          elif "${create[@]}" --target "$BUILT_SHA"; then
            :
          else
            echo "::warning::A tag at $BUILT_SHA was refused (it changes a workflow file and is no longer a branch head); tagging $GITHUB_REF_NAME instead"
            "${create[@]}" --target "$GITHUB_REF_NAME" --notes "Built from commit $BUILT_SHA (the tag is on the head of $GITHUB_REF_NAME, which has moved on)."
          fi
        fi
        gh release upload "$TAG" "$DIR"/* --clobber
