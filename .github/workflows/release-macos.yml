# Builds the macOS app and adds it to its own release macos-v<version> (the other platforms have theirs).
#
#   - Bump `version:` in pubspec.yaml and push (any branch) -> built if its release has no macOS file yet
#   - git tag macos-v0.5.0 && git push origin macos-v0.5.0 -> the same, for that tag
#   - Actions tab -> "Release macOS" -> Run workflow -> the same, for a version you type
#     ... with "dry run" checked -> builds only; the file stays a workflow artifact
#
# macOS runners count 10x against the free minutes of a private repository.
name: Release macOS

on:
  push:
    branches: ["**"]
    paths: [pubspec.yaml]
    tags: ["macos-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (e.g. 0.5.0). Empty = the version in pubspec.yaml"
        required: false
      dry_run:
        description: "Build only: nothing is published"
        type: boolean
        default: false

permissions:
  contents: write # create the release and its tag

# Releases of one platform queue behind each other; a dry run builds on its own.
concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      build_number: ${{ steps.p.outputs.build_number }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          platform: macos
          suffix: -macos.zip
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  macos:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release --build-name ${{ needs.prepare.outputs.version }} --build-number ${{ needs.prepare.outputs.build_number }}
      - name: Collect
        run: |
          name="ARCE.AI-v${{ needs.prepare.outputs.version }}-macos.zip"
          mkdir -p dist
          cp -R build/macos/Build/Products/Release/arce_ai.app dist/ARCE.AI.app
          # ad-hoc signature: not notarized, but Apple silicon refuses to start an unsigned app
          codesign --force --deep --sign - dist/ARCE.AI.app
          (cd dist && ditto -c -k --keepParent ARCE.AI.app "$name" && rm -rf ARCE.AI.app)
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        uses: ./.github/actions/publish
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          title: ARCE.AI v${{ needs.prepare.outputs.version }} (macOS)
          latest: "false" # only the Android release is "latest": the earlier native app reads /releases/latest
