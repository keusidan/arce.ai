# Builds proot (the Termux fork, pinned as the submodule third_party/proot) for Android arm64 with the
# NDK the app uses, and keeps the result as a workflow artifact. This is stage 1 of the in-app Linux
# environment (docs/ARCE_AI_docs_*.md, section 15): it only shows that proot builds, what it weighs and
# what it links against. It does not release anything and is not part of any release workflow.
#
# libtalloc (proot's one dependency) is built from the Ubuntu source package: apt checks its signature.
name: Build proot

on:
  push:
    branches: ["**"]
    paths: [.github/workflows/proot-build.yml, third_party/proot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NDK_VERSION: 29.0.13113456
      API: "31" # the app's minSdk
      TRIPLE: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7

      - name: Fetch only the proot submodule
        run: git submodule update --init --depth 1 third_party/proot

      - name: Install the NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          bin="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "TOOLBIN=$bin" >> "$GITHUB_ENV"
          "$bin/clang" --version | head -1

      - name: Get the libtalloc source from Ubuntu
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev python3
          mkdir "$RUNNER_TEMP/talloc-src"
          cd "$RUNNER_TEMP/talloc-src"
          apt-get source --download-only talloc
          dpkg-source -x talloc_*.dsc talloc
          ls talloc

      - name: Build libtalloc (static) for Android arm64
        run: |
          export CC="$TOOLBIN/${TRIPLE}${API}-clang" AR="$TOOLBIN/llvm-ar" RANLIB="$TOOLBIN/llvm-ranlib"
          cd "$RUNNER_TEMP/talloc-src/talloc"
          cat > cross-answers.txt <<'EOF'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "aarch64"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for -D_LARGE_FILES: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_C99_VSNPRINTF: OK
          Checking for working strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: FAIL
          Checking for HAVE_IFACE_IFREQ: FAIL
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MMAP: OK
          Checking for HAVE_FCNTL_LOCK: OK
          Checking for HAVE_FTRUNCATE_EXTEND: OK
          Checking for HAVE_BROKEN_READDIR: FAIL
          Checking for HAVE_WORKING_GETCWD: OK
          Checking for HAVE_IFACE_AIX: FAIL
          EOF
          # A failure is also written as one annotation, so it can be read without the full log.
          fail() {
            { echo "$1"; tail -n 90 "$2"; } | python3 -c \
              'import sys; print("::error::" + sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'
            exit 1
          }
          ./configure --prefix="$RUNNER_TEMP/talloc-out" --disable-rpath --disable-python \
            --cross-compile --cross-answers=cross-answers.txt > configure.out 2>&1 || {
              { find . -name '*answers*'; grep -h -i 'answer' bin/config.log | sort -u | head -n 60; } >> configure.out
              fail "talloc configure failed" configure.out
            }
          make -j"$(nproc)" > make.out 2>&1 || fail "talloc make failed" make.out
          mkdir -p "$RUNNER_TEMP/talloc-out/lib" "$RUNNER_TEMP/talloc-out/include"
          find bin -name '*.o' | sort
          "$AR" rcs "$RUNNER_TEMP/talloc-out/lib/libtalloc.a" $(find bin -path '*lib/talloc/*' -name '*.o')
          cp talloc.h "$RUNNER_TEMP/talloc-out/include/"
          "$RANLIB" "$RUNNER_TEMP/talloc-out/lib/libtalloc.a"
          ls -l "$RUNNER_TEMP/talloc-out/lib"

      - name: Build proot
        run: |
          export CC="$TOOLBIN/${TRIPLE}${API}-clang" STRIP="$TOOLBIN/llvm-strip" \
                 OBJCOPY="$TOOLBIN/llvm-objcopy" OBJDUMP="$TOOLBIN/llvm-objdump"
          mkdir -p "$RUNNER_TEMP/proot-build"
          cd "$RUNNER_TEMP/proot-build"
          # The loader is a separate file (found at run time through PROOT_LOADER), not unpacked from
          # proot at every start; the path given here is only the fallback. The flags go in through the
          # environment: the makefile appends to them with +=, which a make argument would switch off.
          export CPPFLAGS="-I$RUNNER_TEMP/talloc-out/include" \
                 LDFLAGS="-L$RUNNER_TEMP/talloc-out/lib -Wl,-z,max-page-size=16384" \
                 PROOT_UNBUNDLE_LOADER=/nonexistent
          make -f "$GITHUB_WORKSPACE/third_party/proot/src/GNUmakefile" V=1 proot loader/loader
          ls -l proot loader/loader

      - name: What was built
        run: |
          cd "$RUNNER_TEMP/proot-build"
          mkdir -p out
          cp proot out/libproot.so
          cp loader/loader out/libproot_loader.so
          "$TOOLBIN/llvm-strip" out/libproot.so out/libproot_loader.so
          {
            echo "### proot (Termux fork $(git -C "$GITHUB_WORKSPACE/third_party/proot" describe --tags --always))"
            ls -l out | sed 's/^/    /'
            echo
            echo "readelf (dynamic section, program headers)"
            "$TOOLBIN/llvm-readelf" -d -l out/libproot.so | sed 's/^/    /'
          } | tee out/build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: proot-arm64-v8a
          path: ${{ runner.temp }}/proot-build/out
          retention-days: 14
