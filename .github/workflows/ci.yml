# Static analysis and tests on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Run flutter test
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Failed tests'
              echo '```'
              grep -E "^(  )?[0-9]+:[0-9]+|Expected:|Actual:|Failing|failed|Some tests failed|Error" /tmp/test.log | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
