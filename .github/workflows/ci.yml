# Static analysis and tests on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          # Machine output lets GitHub surface each analyzer finding inline, rather than only
          # reporting a failed command at the workflow line.
          set +e
          flutter analyze --machine > /tmp/arce-analyze.log 2>&1
          status=$?
          cat /tmp/arce-analyze.log
          if [ "$status" -ne 0 ]; then
            # Action log downloads may be unavailable to some contributors, so retain the
            # complete analyzer output as a check annotation as well.
            details="$(tr '\n' ' ' < /tmp/arce-analyze.log)"
            echo "::error::${details:0:60000}"
            exit "$status"
          fi

      - run: flutter test
