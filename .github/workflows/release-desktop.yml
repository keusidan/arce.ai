# Builds the Windows, macOS and Linux apps and attaches them to the GitHub Release of the version.
#
#   - Bump `version:` in pubspec.yaml and push (any branch) -> each OS is built if the release has no file for it yet
#   - git tag v0.5.0 && git push origin v0.5.0              -> the same, for that tag
#   - Actions tab -> "Release Desktop" -> Run workflow       -> the same, for a version you type
#     ... with "dry run" checked                             -> builds only; the files stay workflow artifacts
#
# macOS runners count 10x against the free minutes of a private repository.
name: Release Desktop

on:
  push:
    branches: ["**"]
    paths: [pubspec.yaml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (e.g. 0.5.0). Empty = the version in pubspec.yaml"
        required: false
      dry_run:
        description: "Build only: nothing is published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # One prepare per OS: each decides on its own whether its file is still missing from the release.
  prepare-linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      build_number: ${{ steps.p.outputs.build_number }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          suffix: -linux-x64.tar.gz
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  prepare-windows:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          suffix: -windows-x64.zip
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  prepare-macos:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          suffix: -macos.zip
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  linux:
    needs: prepare-linux
    if: needs.prepare-linux.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: >
          flutter build linux --release
          --build-name ${{ needs.prepare-linux.outputs.version }}
          --build-number ${{ needs.prepare-linux.outputs.build_number }}
      - name: Collect
        run: |
          name="ARCE.AI-${{ needs.prepare-linux.outputs.tag }}-linux-x64.tar.gz"
          mkdir -p dist
          # the contents of the bundle folder, with the executable at the top (the updater relies on it)
          tar -C build/linux/x64/release/bundle -czf "dist/$name" .
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-linux.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "ARCE.AI $TAG" --target "$GITHUB_SHA" --generate-notes \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" dist/* --clobber

  windows:
    needs: [prepare-linux, prepare-windows]
    if: needs.prepare-windows.outputs.release == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release --build-name ${{ needs.prepare-linux.outputs.version }} --build-number ${{ needs.prepare-linux.outputs.build_number }}
      - name: Collect
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          # app-local copy of the Visual C++ runtime, so the app starts on a PC that does not have it
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          $name = "ARCE.AI-${{ needs.prepare-linux.outputs.tag }}-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          # the contents of the Release folder, with the executable at the top (the updater relies on it)
          Compress-Archive -Path "$release/*" -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-linux.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "ARCE.AI $TAG" --target "$GITHUB_SHA" --generate-notes \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" dist/* --clobber

  macos:
    needs: [prepare-linux, prepare-macos]
    if: needs.prepare-macos.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release --build-name ${{ needs.prepare-linux.outputs.version }} --build-number ${{ needs.prepare-linux.outputs.build_number }}
      - name: Collect
        run: |
          name="ARCE.AI-${{ needs.prepare-linux.outputs.tag }}-macos.zip"
          mkdir -p dist
          cp -R build/macos/Build/Products/Release/arce_ai.app dist/ARCE.AI.app
          # ad-hoc signature: not notarized, but Apple silicon refuses to start an unsigned app
          codesign --force --deep --sign - dist/ARCE.AI.app
          (cd dist && ditto -c -k --keepParent ARCE.AI.app "$name" && rm -rf ARCE.AI.app)
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-linux.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "ARCE.AI $TAG" --target "$GITHUB_SHA" --generate-notes \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" dist/* --clobber
