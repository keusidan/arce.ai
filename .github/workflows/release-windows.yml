# Builds the Windows app and adds it to its own release windows-v<version> (the other platforms have theirs).
#
#   - Bump `version:` in pubspec.yaml and push (any branch) -> built if its release has no Windows file yet
#   - git tag windows-v0.5.0 && git push origin windows-v0.5.0 -> the same, for that tag
#   - Actions tab -> "Release Windows" -> Run workflow -> the same, for a version you type
#     ... with "dry run" checked -> builds only; the file stays a workflow artifact
name: Release Windows

on:
  push:
    branches: ["**"]
    paths: [pubspec.yaml]
    tags: ["windows-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (e.g. 0.5.0). Empty = the version in pubspec.yaml"
        required: false
      dry_run:
        description: "Build only: nothing is published"
        type: boolean
        default: false

permissions:
  contents: write # create the release and its tag

# Releases of one platform queue behind each other; a dry run builds on its own.
concurrency:
  group: release-windows-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      build_number: ${{ steps.p.outputs.build_number }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          platform: windows
          suffix: -windows-x64.zip
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # desktop llama.cpp runtime
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run flutter test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter test *>&1 | Tee-Object -FilePath "$env:TEMP/arce-test.log"
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            # The failure is at the end of Flutter's test output; preserve that rather than
            # letting a long list of successful tests exhaust GitHub's annotation limit.
            $details = (Get-Content "$env:TEMP/arce-test.log" -Tail 160) -join ' '
            Write-Output "::error::$details"
            exit $status
          }
      - name: Build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release --build-name ${{ needs.prepare.outputs.version }} --build-number ${{ needs.prepare.outputs.build_number }} *>&1 | Tee-Object -FilePath "$env:TEMP/arce-build.log"
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $details = (Get-Content -Raw "$env:TEMP/arce-build.log") -replace "`r?`n", ' '
            Write-Output "::error::$details"
            exit $status
          }
      - name: Collect
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          # app-local copy of the Visual C++ runtime, so the app starts on a PC that does not have it
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          $name = "ARCE.AI-v${{ needs.prepare.outputs.version }}-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          # the contents of the Release folder, with the executable at the top (the updater relies on it)
          Compress-Archive -Path "$release/*" -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        uses: ./.github/actions/publish
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          title: ARCE.AI v${{ needs.prepare.outputs.version }} (Windows)
          latest: "false" # only the Android release is "latest": the earlier native app reads /releases/latest
