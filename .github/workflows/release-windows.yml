# Builds the Windows app and adds it to its own release windows-v<version> (the other platforms have theirs).
#
#   - Bump `version:` in pubspec.yaml and push (any branch) -> built if its release has no Windows file yet
#   - git tag windows-v0.5.0 && git push origin windows-v0.5.0 -> the same, for that tag
#   - Actions tab -> "Release Windows" -> Run workflow -> the same, for a version you type
#     ... with "dry run" checked -> builds only; the file stays a workflow artifact
name: Release Windows

on:
  push:
    branches: ["**"]
    paths: [pubspec.yaml]
    tags: ["windows-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (e.g. 0.5.0). Empty = the version in pubspec.yaml"
        required: false
      dry_run:
        description: "Build only: nothing is published"
        type: boolean
        default: false

permissions:
  contents: write # create the release and its tag

# Releases of one platform queue behind each other; a dry run builds on its own.
concurrency:
  group: release-windows-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      build_number: ${{ steps.p.outputs.build_number }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        uses: ./.github/actions/prepare
        with:
          platform: windows
          suffix: -windows-x64.zip
          version: ${{ inputs.version }}
          token: ${{ github.token }}

  windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The database tests open SQLite, which `sqlite3` 3.x supplies through a build hook: the
      # hook fetches (or builds) the library for whichever process runs the tests. That has been
      # failing on this runner since 0.4.1 while `flutter analyze` passes, and the job log of this
      # repository cannot be downloaded by the account maintaining it, so this step prints what
      # failed instead of stopping at "flutter test failed".
      # Fallback: build the app first (the same hook runs for it), then let the tests find the
      # library in the folder that receives it.
      - name: Test
        shell: pwsh
        run: |
          flutter test 2>&1 | Tee-Object -FilePath test-first.log
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          Write-Host '::group::First failure'
          Get-Content test-first.log |
            Select-String -Pattern '(Failed to load|Invalid argument|Cannot open|error code|\[E\]|Expected:|Actual:)' -Context 2,4 |
            Select-Object -First 40
          Write-Host '::endgroup::'
          Write-Host 'Retrying after building the app, with its folder on PATH'
          flutter build windows --release --build-name ${{ needs.prepare.outputs.version }} --build-number ${{ needs.prepare.outputs.build_number }} 2>&1 | Select-Object -Last 15
          foreach ($dir in 'build\windows\x64\runner\Release', 'build\windows\x64\runner\Debug') {
            $env:PATH = "$PWD\$dir;$env:PATH"
          }
          Get-ChildItem -Path build -Filter 'sqlite3*.dll' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "found $($_.FullName)" }
          flutter test 2>&1 | Tee-Object -FilePath test-second.log
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          Write-Host '::group::Second failure'
          Get-Content test-second.log |
            Select-String -Pattern '(Failed to load|Invalid argument|Cannot open|error code|\[E\]|Expected:|Actual:)' -Context 2,4 |
            Select-Object -First 40
          Write-Host '::endgroup::'
          exit $code
      - run: flutter build windows --release --build-name ${{ needs.prepare.outputs.version }} --build-number ${{ needs.prepare.outputs.build_number }}
      - name: Collect
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          # app-local copy of the Visual C++ runtime, so the app starts on a PC that does not have it
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          $name = "ARCE.AI-v${{ needs.prepare.outputs.version }}-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          # the contents of the Release folder, with the executable at the top (the updater relies on it)
          Compress-Archive -Path "$release/*" -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        uses: ./.github/actions/publish
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          title: ARCE.AI v${{ needs.prepare.outputs.version }} (Windows)
          latest: "false" # only the Android release is "latest": the earlier native app reads /releases/latest
