name: zz merge

# Temporary: put main on the v0.4.6 line (the tree the 0.4.6 releases were built from).
on:
  push:
    branches: ["feat/llm-db"]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: move main to v0.4.6
        run: git push --force origin 5f1a4af5975abdc90f11bf3e531a93ce3142ffdd:refs/heads/main
