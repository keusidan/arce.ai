name: zz merge

# Temporary: move main to the verified commit (the tree CI and the Android release ran on).
on:
  push:
    branches: ["feat/app-settings-tool"]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
