# Temporary probe: can a release be created for a tag that already exists at a workflow commit?
# Every release and tag it creates is deleted again. Removed once the cause is known.
name: Probe release permission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Try the calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="claude/great-lovelace-3lg7st"
          old_wf=60bb9ec2abaf0ab8f160afef2839c6739dadbaa8   # the failed release run's commit: touches workflows, not the head
          old_doc=6bb2e61f27a24a7e55febd2abd4033f6efea248c   # docs only, not the head
          echo "head=$(git rev-parse HEAD)"

          show() { grep -iE '^(HTTP/|"message"|\{"message|gh: |error|fatal|remote:|To |.*rejected)' || true; }
          rel() { # name target-or-empty
            local tag="$1" body
            body="$(jq -n --arg t "$tag" --arg c "$2" \
              '{tag_name:$t,name:$t,draft:false,prerelease:true,make_latest:"false"} + (if $c=="" then {} else {target_commitish:$c} end)')"
            gh api -i -X POST "repos/$GITHUB_REPOSITORY/releases" --input - <<< "$body" 2>&1 | show
          }
          clean() { gh release delete "$1" --cleanup-tag --yes > /dev/null 2>&1 || true
                    git push origin ":refs/tags/$1" > /dev/null 2>&1 || true; }

          # a tag a person pushed earlier, at the old workflow commit
          echo "--- T1 release for the existing tag, no target"
          rel probe-tagtest ""
          gh release delete probe-tagtest --yes > /dev/null 2>&1 || true
          echo "--- T2 release for the existing tag, target=the same commit (what the v0.1.0 run did)"
          rel probe-tagtest "$old_wf"
          gh release delete probe-tagtest --yes > /dev/null 2>&1 || true
