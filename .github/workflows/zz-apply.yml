name: zz apply

# Temporary: apply the patches on the v0.4.6 tree, check them, and only then move main there.
on:
  push:
    branches: ["zz-apply"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: apply the patches on the v0.4.6 tree
        run: |
          mkdir -p /tmp/p
          cp settings-tools*.patch /tmp/p/
          git checkout -B work 5f1a4af5975abdc90f11bf3e531a93ce3142ffdd
          for f in $(ls /tmp/p/*.patch | sort); do
            echo "applying $f"
            git apply "$f"
          done
          git add -A
          git -c user.name=keusidan -c user.email=87552495+keusidan@users.noreply.github.com \
            commit -m "設定を読む get_settings を足し、update_settings を承認つきで動かす"
      - run: flutter pub get
      - name: analyze
        run: |
          set +e
          flutter analyze > an.txt 2>&1
          if grep -q "No issues found" an.txt; then
            echo "analyze clean"
            exit 0
          fi
          grep -E " • |issues? found" an.txt | head -20 > issues.txt
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error::$clean"
          done < issues.txt
          exit 1
      - name: test
        run: |
          set +e
          flutter test > t.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "tests pass"
            exit 0
          fi
          grep -nE "\[E\]|Expected:|Actual:|Which:|Some tests failed|All tests passed" t.txt | head -25 > tf.txt
          tail -25 t.txt >> tf.txt
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error::$clean"
          done < tf.txt
          exit 1
      - name: push main
        run: git push origin work:refs/heads/main
