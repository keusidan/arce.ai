name: zz debug analyze

# Temporary: fix one line and report the analyzer output as annotations.
on:
  workflow_dispatch:
  push:
    branches: ["feat/app-settings-tool"]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: fix the editing mistake
        run: |
          sed -i 's/earlierText = _shown = shown;/earlierText = shown;/' lib/core/chat_controller.dart
          git config user.name "keusidan"
          git config user.email "87552495+keusidan@users.noreply.github.com"
          git add lib/core/chat_controller.dart
          git diff --cached --quiet || git commit -m "Fix a mistaken line in chat_controller [skip ci]"
          git push || true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze and annotate
        run: |
          set +e
          flutter analyze > an.txt 2>&1
          grep -E " • |issues? found|No issues" an.txt | head -30 > issues.txt
          tail -3 an.txt >> issues.txt
          cat issues.txt
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error::$clean"
          done < issues.txt
          exit 1
