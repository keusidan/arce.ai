name: arce_ai
description: "ARCE.AI - local AI chat & coding assistant for Android, iOS, Windows, macOS and Linux."
publish_to: 'none'

# build-name is the version users see and the updater compares; build-number is the Android
# versionCode. The release workflow overrides both (--build-name / --build-number), so to ship a
# new version, change the part before "+" and push to main.
version: 0.9.4+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.3.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.7.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Noto Sans JP from Google Fonts (SIL OFL 1.1, assets/fonts/OFL.txt). Bundled so Japanese text
  # uses Japanese glyphs on every platform; without it Linux and Android pick the Chinese variant
  # of a system CJK font for characters shared between the languages (直, 骨, 角 ...).
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP[wght].ttf

# Regenerate the launcher icons of every platform from assets/icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 31
  adaptive_icon_background: "#171920"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
