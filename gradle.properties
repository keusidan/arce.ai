# Memory-tuned for low-RAM build machines (2 vCPU / 2GB)
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
# Keep Kotlin compiler inside the Gradle JVM to save memory
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx800m
android.useAndroidX=true
android.nonTransitiveRClass=true
