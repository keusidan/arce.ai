org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Reuse task outputs (e.g. compiled Kotlin) across builds; setup-gradle keeps this cache in CI
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# GPU backends for llama.cpp (off until verified on a device, see docs)
arce.ggml.vulkan=false
arce.ggml.opencl=false

# Compile llama.cpp through ccache (install ccache first). CI turns this on.
arce.ccache=false
